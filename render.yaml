services:
  - type: web
    name: persift-discovery
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.discovery
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: persift-db
          property: connectionString
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: LOG_LEVEL
        sync: false

databases:
  - name: persift-db
    plan: free
    databaseName: persift
    user: persift
